name: corpus-registry-ci

on:
  pull_request:
    paths:
      - "src/corpus/**"
      - "test/corpusRegistry.mjs"
      - "test/fixtures/corpus/**"
      - "docs/corpus-registry.md"
      - ".github/workflows/corpus-registry.yml"

jobs:
  corpus-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Corpus registry fixed inputs
        run: node test/corpusRegistry.mjs

      - name: Public MCP entrypoint unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" HEAD -- src/index.ts | grep -q .; then
            echo "src/index.ts changed; corpus registry must not add or modify public MCP tools."
            exit 1
          fi
