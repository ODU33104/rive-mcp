name: Release

# v* タグの push で起動する。npm は Trusted Publishing（OIDC）で公開するため、トークンも OTP も使わない。
# 事前設定（一度だけ）: npmjs.com の rive-mcp-server → Settings → Trusted Publisher に
# GitHub Actions / ODU33104 / rive-mcp / release.yml を登録する。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 手動実行は MCP Registry の登録だけをやり直す（npm 公開と Release はタグのときだけ）

permissions:
  contents: write # GitHub Release の作成
  id-token: write # npm と MCP Registry の OIDC 認証

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing には npm 11.5.1 以上が必要
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: node test/studio-security.mjs
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          v="$(node -p "require('./package.json').version")"
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - name: npm publish
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
      # MCP Registry（io.github.ODU33104/rive-mcp）。npm 公開が済んだ後なので、失敗しても公開は取り消さない
      # npm のレジストリに新版が見えるまで数分かかることがあるので、見えるまで待つ
      - name: Wait for npm
        run: |
          v="$(node -p "require('./package.json').version")"
          for i in $(seq 1 36); do curl -sf "https://registry.npmjs.org/rive-mcp-server/$v" > /dev/null && exit 0; sleep 10; done
          echo "npm does not show $v yet"; exit 1
      - name: MCP Registry
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo modelcontextprotocol/registry --pattern 'mcp-publisher_*linux_amd64.tar.gz' --output mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
