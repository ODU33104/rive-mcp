name: pre-post-release-comparison

on:
  pull_request:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout comparison harness
        uses: actions/checkout@v4

      - name: Checkout baseline main snapshot
        uses: actions/checkout@v4
        with:
          ref: d44adbbe224e38aacf2caad43c32dc482fc23bf8
          path: compare/baseline

      - name: Checkout current implementation snapshot
        uses: actions/checkout@v4
        with:
          ref: dec889c9df42009930da9c6cadd6bbfe525caea2
          path: compare/current

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build baseline
        working-directory: compare/baseline
        run: |
          npm ci
          npm run build

      - name: Install and build current
        working-directory: compare/current
        run: |
          npm ci
          npm run build

      - name: Measure old vs new on the same runner
        env:
          BASELINE_SHA: d44adbbe224e38aacf2caad43c32dc482fc23bf8
          CURRENT_SHA: dec889c9df42009930da9c6cadd6bbfe525caea2
        run: node test/prePostCompare.mjs compare/baseline compare/current

      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-post-release-comparison
          path: test/tmp/pre-post-comparison
          if-no-files-found: error
